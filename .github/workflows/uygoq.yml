# Bepul Render serveri uxlab qolmasligi uchun har 10 daqiqada /health manzilini ochadi.
name: Serverni uyg'oq ushlash
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: /health ni ochish
        run: |
          for i in 1 2 3; do
            curl -fsS -m 90 https://lenon-katalog-bot.onrender.com/health && exit 0
            sleep 20
          done
          exit 1
