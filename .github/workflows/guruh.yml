# Guruhdagi ochiq postlarni yuklab olish (rasmlarni tiklash uchun, qo'lda ishga tushiriladi)
name: Guruh postlari
on:
  workflow_dispatch:
    inputs:
      ids: {default: "1"}
permissions:
  contents: write
jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - run: |
          mkdir out
          for i in ${{ inputs.ids }}; do
            curl -sS -m 20 -A "TelegramBot (like TwitterBot)" "https://t.me/lenondokon/$i" -o out/$i.html || true
            sleep 0.3
          done
          tar czf posts.tgz out
          git init -q d && cd d && mv ../posts.tgz . && git checkout -q -b guruh-data
          git -c user.name=bot -c user.email=bot@users.noreply.github.com add .
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm data
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" guruh-data
