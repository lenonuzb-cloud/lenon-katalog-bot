# Server holatini ko'rish (qo'lda ishga tushiriladi)
name: Server holati
on:
  workflow_dispatch:
    inputs:
      extra: {default: ""}
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: |
          for p in health uz/health ${{ inputs.extra }}; do
            echo "== /$p"; curl -sS -m 120 "https://lenon-katalog-bot.onrender.com/$p" || true; echo
            sleep 16
          done
