services:
  - type: web
    name: lenon-katalog-bot
    runtime: python
    plan: free
    region: frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        value: "8823403417"
      # Ikkinchi bot (@lenonyordamchibot, LENON_UZ) tokeni — Render'da Environment bo'limida qo'shiladi.
      # Berilsa, shu bitta xizmatda ikkala bot ishlaydi (bepul 750 soat ikki xizmatga yetmaydi).
      - key: BOT_TOKEN_UZ
        sync: false
