<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>LENON Katalog</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@500;600&display=swap">
<style>
:root{
  --bg:#ffffff; --bg2:#faf7f0; --ivory:#f4efe3;
  --text:#1c1a16; --hint:#8f877a; --line:#ece6d8;
  --gold:#b8891a; --gold2:#d9b45a; --gold-dark:#8a6512;
  --grad:linear-gradient(135deg,#d9b45a 0%,#b8891a 55%,#9a7114 100%);
  --red:#d42b2b; --green:#1f9d55;
  --btn:var(--gold); --btn-text:#fff; --card:#fff;
  --serif:"Playfair Display",Georgia,serif;
  --sans:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 var(--sans)}
header{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);padding:12px 16px 0;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;justify-content:center;position:relative;height:34px}
.top img{height:30px}
.top .admin{position:absolute;right:0;border:0;font-size:10px;letter-spacing:1px;font-weight:700;color:#fff;background:var(--grad);padding:4px 9px;border-radius:20px;display:none}
.search{margin-top:10px;display:flex;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:0 12px;align-items:center;transition:border-color .15s}
.search:focus-within{border-color:var(--gold2)}
.search span{opacity:.5;font-size:14px}
.search input{flex:1;border:0;background:transparent;color:var(--text);font:15px var(--sans);padding:11px 8px;outline:none}
.tabs{display:flex;gap:22px;overflow-x:auto;margin-top:6px;scrollbar-width:none;justify-content:center}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;padding:10px 2px 11px;background:none;border:0;border-bottom:2.5px solid transparent;color:var(--hint);font:600 13px var(--sans);letter-spacing:1.5px;text-transform:uppercase}
.tab.on{color:var(--gold-dark);border-bottom-color:var(--gold)}
main{padding:18px 16px 100px;max-width:560px;margin:0 auto}
.grid{display:grid;grid-template-columns:1fr;gap:22px}
.card{background:var(--card);border-radius:20px;overflow:hidden;position:relative;border:1px solid var(--line);padding:0;text-align:left;color:var(--text);box-shadow:0 6px 24px rgba(120,90,20,.08);font:inherit;width:100%}
.card:active{transform:scale(.99)}
.card .ph{aspect-ratio:4/5;background:var(--ivory) center/cover no-repeat;position:relative}
.card .ph::after{content:"";position:absolute;inset:auto 0 0 0;height:30%;background:linear-gradient(to top,rgba(0,0,0,.18),transparent)}
.card .ph.empty{display:flex;align-items:center;justify-content:center;color:var(--gold);font:600 34px var(--serif);aspect-ratio:16/9}
.card .ph.empty::after{display:none}
.card .info{padding:14px 18px 16px}
.card .t{font:600 22px/1.2 var(--serif);letter-spacing:.2px}
.card .meta{display:flex;justify-content:space-between;align-items:center;margin-top:8px;padding-top:10px;border-top:1px solid var(--line)}
.card .s{color:var(--hint);font-size:13px}
.card .go{color:var(--gold-dark);font-weight:600;font-size:13px}
.card.out .ph{filter:grayscale(.75) opacity(.75)}
.bdg{position:absolute;top:14px;z-index:2;font-size:11px;font-weight:800;padding:5px 10px;border-radius:8px;letter-spacing:.8px}
.bdg.l{left:14px}.bdg.r{right:14px}
.bdg.new{background:var(--red);color:#fff}
.bdg.out{background:#fff;color:var(--red);border:1.5px solid var(--red)}
.bdg.in{background:var(--green);color:#fff}
.chip{display:inline-block;font-size:9.5px;font-weight:800;padding:2px 6px;border-radius:5px;margin-left:6px;vertical-align:2px;letter-spacing:.5px}
.chip.new{background:var(--red);color:#fff}
.chip.out{color:var(--red);border:1px solid var(--red)}
.chip.in{background:var(--green);color:#fff}
.slidewrap{position:relative;margin:-2px -16px 0}
.slides{display:flex;overflow-x:auto;scroll-snap-type:x mandatory;background:var(--ivory);scrollbar-width:none}
.slides::-webkit-scrollbar{display:none}
.slides img{flex:none;width:100%;aspect-ratio:4/5;object-fit:cover;scroll-snap-align:center}
.dots{position:absolute;bottom:12px;left:0;right:0;text-align:center}
.dots i{display:inline-block;width:6px;height:6px;border-radius:3px;background:#fff;opacity:.55;margin:0 3px;transition:.2s}
.dots i.on{opacity:1;width:18px}
h1{font:600 28px/1.15 var(--serif);margin:20px 0 6px;text-align:center}
h1 + div:empty{display:none}
.sec-h{font:600 24px var(--serif);margin:26px 0 10px;text-align:center}
.sec-h:first-child{margin-top:4px}
.orn{display:flex;align-items:center;justify-content:center;gap:10px;color:var(--gold);margin:4px 0 14px;font-size:11px;letter-spacing:3px}
.orn::before,.orn::after{content:"";height:1px;width:60px;background:linear-gradient(90deg,transparent,var(--gold2))}
.orn::after{transform:scaleX(-1)}
.note{color:var(--red);font-weight:700;text-align:center;margin:4px 0}
.agents{display:flex;gap:8px;margin:14px 0 4px;flex-wrap:wrap;justify-content:center}
.agents button{border:1.5px solid var(--gold2);background:#fff;color:var(--gold-dark);border-radius:30px;padding:8px 16px;font:600 13px var(--sans)}
.btn{border:0;border-radius:14px;padding:13px 14px;font:600 15px var(--sans);background:var(--grad);color:#fff}
.btn.ghost{background:var(--bg2);color:var(--text);border:1px solid var(--line)}
.btn.danger{background:var(--red);color:#fff}
.tbl{background:#fff;border:1px solid var(--line);border-radius:18px;overflow:hidden;margin-top:14px}
.cat{background:var(--bg2);font:700 11px var(--sans);letter-spacing:2px;text-transform:uppercase;text-align:center;padding:10px;color:var(--gold-dark);border-top:1px solid var(--line)}
.tbl > .cat:first-child{border-top:0}
.row{display:grid;grid-template-columns:24px 1fr auto auto;gap:10px;align-items:center;padding:12px 14px;border-top:1px solid var(--line)}
.cat + .row{border-top:0}
.row .n{color:var(--hint);font-size:11px;text-align:center}
.row .nm{font-weight:500}
.row .cd{color:var(--hint);font-size:11.5px;font-variant-numeric:tabular-nums;letter-spacing:.3px}
.row .pr{font-weight:700;color:var(--gold-dark);font-variant-numeric:tabular-nums;min-width:46px;text-align:right}
.row.out .nm{color:var(--red);text-decoration:line-through}
.row.out .pr{color:var(--hint)}
.row.adm{grid-template-columns:24px 1fr auto auto 46px}
.sw{width:42px;height:24px;border-radius:12px;background:#e3dccd;position:relative;border:0;padding:0}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:.15s}
.sw:not(.on){background:var(--red)}
.sw.on{background:var(--green)}
.sw.on::after{left:21px}
.empty-msg{text-align:center;color:var(--hint);padding:50px 10px}
.nabor-info{background:var(--bg2);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px;text-align:center}
.nabor-info b{color:var(--gold-dark)}
.res{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;width:100%;text-align:left;color:var(--text);font:inherit}
.res small{color:var(--hint);display:block;margin-top:2px}
.res > b{color:var(--gold-dark)}
.sheet-bg{position:fixed;inset:0;background:rgba(30,25,15,.4);z-index:50;display:none;align-items:flex-end}
.sheet{background:#fff;width:100%;border-radius:22px 22px 0 0;padding:20px 18px 30px;max-height:90vh;overflow:auto}
.sheet h3{margin:0 0 12px;font:600 22px var(--serif)}
.sheet label{display:block;font-size:11px;letter-spacing:1px;text-transform:uppercase;color:var(--hint);margin:12px 2px 5px}
.sheet input,.sheet select{width:100%;padding:12px 13px;border-radius:12px;border:1px solid var(--line);background:var(--bg2);color:var(--text);font-size:16px;font-family:var(--sans)}
.sheet input:focus{outline:none;border-color:var(--gold2)}
.sheet .acts{display:flex;gap:10px;margin-top:18px}
.sheet .acts .btn{flex:1}
.toast{position:fixed;left:16px;right:16px;bottom:84px;z-index:60;background:#1c1a16;color:#fff;padding:13px 15px;border-radius:14px;font-size:14px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.2)}
.toast.warn{background:#8a5a00}
.addbtn{width:100%;margin-top:12px}
.loading{text-align:center;padding:80px;color:var(--hint);font-family:var(--serif);font-size:18px}

.grid.two{grid-template-columns:1fr 1fr;gap:12px}
.card.sm{border-radius:16px}
.card.sm .ph{aspect-ratio:1}
.card.sm .info{padding:10px 12px 12px}
.card.sm .t{font:600 16px/1.2 var(--serif)}
.card.sm .s{font-size:12px;margin-top:3px}
.card.sm .bdg{top:8px;font-size:9.5px;padding:3px 7px}
.card.sm .bdg.l{left:8px}.card.sm .bdg.r{right:8px}
.card .ph.empty small{font:500 14px var(--sans);color:var(--hint)}
.card .sub2{color:var(--hint);font-size:13px;margin-top:4px}
.card .sub2 b{color:var(--gold-dark)}
.compo{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:0 0 18px}
.compo span{background:var(--bg2);border:1px solid var(--line);border-radius:20px;padding:5px 11px;font-size:12px;color:var(--hint)}
.compo b{color:var(--text);font-weight:600}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between;margin:18px 0 4px;padding:10px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}
.toolbar span{color:var(--hint);font-size:13px}
.tbtn{border:1.5px solid var(--gold2);background:#fff;color:var(--gold-dark);border-radius:30px;padding:8px 16px;font:600 13px var(--sans)}
.gcat{font:700 11px var(--sans);letter-spacing:2.5px;text-transform:uppercase;color:var(--gold-dark);text-align:center;margin:22px 0 12px;display:flex;align-items:center;gap:10px}
.gcat::before,.gcat::after{content:"";flex:1;height:1px;background:var(--line)}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;padding:0;text-align:left;font:inherit;color:var(--text);position:relative;box-shadow:0 3px 14px rgba(120,90,20,.06)}
.pcard:active{transform:scale(.98)}
.pcard .ph{aspect-ratio:1;background:var(--ivory) center/cover no-repeat;position:relative}
.pcard .ph.empty{display:flex;align-items:center;justify-content:center;padding:12px;text-align:center;font:600 15px/1.25 var(--serif);color:var(--gold);background:linear-gradient(160deg,#fbf8f1,#f1e9d6)}
.pcard .bdg{top:8px;font-size:9px;padding:3px 6px;border-radius:6px}
.pcard .bdg.l{left:8px}.pcard .bdg.r{right:8px}
.pcard.out .ph{filter:grayscale(.75) opacity(.7)}
.pcard .pi{padding:9px 11px 11px}
.pcard .pn{font-weight:600;font-size:14px;line-height:1.25;min-height:2.5em}
.pcard .pm{display:flex;justify-content:space-between;align-items:baseline;margin-top:4px}
.pcard .pm span{color:var(--hint);font-size:11px;letter-spacing:.3px}
.pcard .pm b{color:var(--gold-dark);font-size:15px}
.pwrap{position:relative;margin:-4px 0 12px}
.pbig{width:100%;aspect-ratio:1;object-fit:cover;border-radius:16px;display:block;background:var(--ivory)}
.pbig.empty{display:flex;align-items:center;justify-content:center;font:600 24px var(--serif);color:var(--gold);background:linear-gradient(160deg,#fbf8f1,#f1e9d6)}
.pinfo{display:flex;justify-content:space-between;align-items:center;font-size:14px;color:var(--hint)}
.pinfo b{color:var(--text)}
.pinfo .pp{font:700 22px var(--sans);color:var(--gold-dark)}
.pinfo2{color:var(--hint);font-size:12px;margin-top:4px}
.backfab{position:fixed;left:16px;bottom:calc(18px + env(safe-area-inset-bottom));z-index:55;display:none;align-items:center;gap:2px;
  border:0;border-radius:30px;padding:13px 22px 13px 18px;background:var(--grad);color:#fff;font:600 15px var(--sans);
  box-shadow:0 8px 24px rgba(140,100,20,.35)}
.backfab.on{display:flex}
.backfab:active{transform:scale(.96)}
main{padding-bottom:110px}
.sheet{padding-bottom:90px}
.res{align-items:center}
.res .rt{flex:1;min-width:0}
.res .rp{color:var(--gold-dark);font-weight:700;white-space:nowrap}
.th{flex:none;width:48px;height:48px;border-radius:10px;background:var(--ivory) center/cover no-repeat;display:flex;align-items:center;justify-content:center;font:600 18px var(--serif);color:var(--gold);font-style:normal}
.res-h{color:var(--hint);font-size:12px;letter-spacing:.5px;margin:0 2px 10px}
.toolbar .tbs{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.toolbar b.red{color:var(--red);font-weight:600}
.newdz{width:100%;border:1.5px dashed var(--gold2);background:var(--bg2);color:var(--gold-dark);border-radius:16px;padding:14px;font:600 15px var(--sans);margin-bottom:18px}
.choice{display:flex;gap:14px;align-items:flex-start;width:100%;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px;font:inherit;color:var(--text)}
.choice:active{border-color:var(--gold2);background:var(--bg2)}
.choice span{font-size:26px;line-height:1}
.choice b{display:block;font-size:16px;margin-bottom:4px}
.choice small{color:var(--hint);font-size:13px;line-height:1.35}
.search.pk{margin:0 0 10px}
.sheet .search input{border:0;background:transparent;padding:11px 8px;border-radius:0}
.pk-list{max-height:52vh;overflow:auto;margin:0 -4px;padding:0 4px}
.pk-cat{font:700 10.5px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark);margin:14px 2px 6px}
.sheet .pk-row{display:flex;font-size:14px;letter-spacing:0;text-transform:none;color:var(--text);margin:0 0 6px}
.pk-row{display:flex;align-items:center;gap:10px;padding:9px 10px;border:1px solid var(--line);border-radius:12px;margin-bottom:6px;background:#fff}
.pk-row.on{border-color:var(--gold2);background:#fffaf0}
.pk-row input{width:20px;height:20px;accent-color:var(--gold);flex:none;margin:0}
.pk-row .rt{flex:1;min-width:0}
.pk-row .rt b{font-weight:600}
.pk-row .rt small{display:block;color:var(--hint);font-size:11.5px}
.pk-row .rp{color:var(--gold-dark);white-space:nowrap}
.pk-row .th{width:40px;height:40px}
.pk-bar{display:flex;gap:10px;margin-top:12px}
.pk-bar .btn{flex:1}
.btn[disabled]{opacity:.45}
.ro-help{color:var(--hint);font-size:13px;text-align:center;margin:-4px 0 14px}
.ro-list{display:flex;flex-direction:column;gap:6px}
.ro{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 4px}
.ro .hd{flex:none;width:30px;text-align:center;font-size:22px;color:var(--gold);cursor:grab;touch-action:none;user-select:none}
.ro .rt{flex:1;min-width:0}
.ro .rt b{font-weight:600;font-size:14px}
.ro .rt small{display:block;color:var(--hint);font-size:11.5px}
.ro-cat{background:var(--bg2);border-color:var(--gold2);margin-top:10px}
.ro-cat b{flex:1;font:700 12px var(--sans);letter-spacing:2px;text-transform:uppercase;color:var(--gold-dark)}
.ro-btns{display:flex;gap:4px;flex:none}
.ro-btns button{width:34px;height:34px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--gold-dark);font-size:13px;padding:0}
.ro-ghost{opacity:.4;background:#fff7e0}
.ro-bar{position:sticky;bottom:12px;display:flex;gap:10px;margin-top:14px;padding:8px;background:rgba(255,255,255,.95);border-radius:16px;box-shadow:0 6px 24px rgba(0,0,0,.08);margin-left:96px}
.ro-bar .btn{flex:1}
.rep{font-size:14px;line-height:1.5;background:var(--bg2);border:1px solid var(--line);border-radius:14px;padding:14px;max-height:62vh;overflow:auto}
.rep ul{margin:6px 0 12px;padding-left:18px}
.seg{display:flex;gap:6px;margin-bottom:12px}
.seg button{flex:1;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px;font:600 13px var(--sans);color:var(--hint)}
.seg button.on{border-color:var(--gold2);color:var(--gold-dark);background:#fffaf0}
.pk-row.have{opacity:.55;background:var(--bg2)}
.pk-row.have input{accent-color:#9a9a9a}
</style>
</head>
<body>
<header>
  <div class="top"><img src="/static/logo.png" alt="LENON"><button class="admin" id="adm">⚙️ ADMIN</button></div>
  <div class="search"><span>🔍</span><input id="q" type="search" placeholder="Nomi yoki kodi bo'yicha qidirish"></div>
  <div class="tabs" id="tabs"></div>
</header>
<main id="main"><div class="loading">Yuklanmoqda…</div></main>

<div class="sheet-bg" id="sheetbg"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>
<button class="backfab" id="backfab" aria-label="Ortga">‹&nbsp; Ortga</button>

<script>
const tg = window.Telegram ? Telegram.WebApp : null;
if (tg) { tg.ready(); tg.expand(); try{ tg.setHeaderColor("#ffffff"); tg.setBackgroundColor("#ffffff"); }catch(e){} }
const initData = tg ? tg.initData : "";
let CAT = null, ADMIN = false, BOT = "";
let view = {name: "section", key: "lenon"};
const stack = [];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const img = (fid, w=600) => `/img/${encodeURIComponent(fid)}?w=${w}`;

function toast(msg, warn=false){
  const t=$("#toast"); t.textContent=msg; t.className="toast"+(warn?" warn":""); t.style.display="block";
  clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none", warn?5000:2200);
}
function haptic(){ try{ tg && tg.HapticFeedback.impactOccurred("light"); }catch(e){} }

async function load(){
  const r = await fetch("/api/catalog"); CAT = await r.json(); BOT = CAT.bot || "";
  if (initData){
    try{ const m = await (await fetch("/api/me",{headers:{"X-Init-Data":initData}})).json(); ADMIN = !!m.admin; }catch(e){}
  }
  $("#adm").style.display = ADMIN ? "inline-block" : "none";
  $("#adm").onclick = adminPanel;
  let sp = tg && tg.initDataUnsafe ? tg.initDataUnsafe.start_param : null;
  if (!sp){ const u = new URLSearchParams(location.search); if (u.get("d")) sp = "d_" + u.get("d"); }
  if (sp && sp.startsWith("d_")){ const d = findDesign(sp.slice(2)); if (d){ if (d.sec.kind==="nabor"){ view = {name:"section", key:"naborlar"}; stack.push(view); view = {name:"nabor", key:d.sec.key}; } else view = {name:"section", key:d.sec.key}; renderTabs(); go({name:"design", id:d.d.id}); return; } }
  renderTabs(); render();
}

function sections(){
  const s = CAT.sections;
  const nab = s.filter(x=>x.kind==="nabor");
  const out = s.filter(x=>x.kind==="design");
  if (nab.length) out.push({key:"naborlar", title:"Naborlar", kind:"nabors", list:nab});
  const ras = s.find(x=>x.kind==="photos"); if (ras && ras.designs.length) out.push(ras);
  return out;
}
function findDesign(id){
  for (const sec of CAT.sections) for (const d of sec.designs) if (d.id===id) return {sec, d};
  return null;
}

function renderTabs(){
  $("#tabs").innerHTML = sections().map(s =>
    `<button class="tab ${view.key===s.key || (view.key||"").startsWith("nabor")&&s.key==="naborlar" ? "on":""}" data-k="${s.key}">${esc(s.title)}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => { stack.length=0; view={name:"section", key:b.dataset.k}; $("#q").value=""; renderTabs(); render(); updateBack(); });
}

function go(v){ $("#q").value=""; view.scroll = window.scrollY; stack.push(view); view=v; render(); updateBack(); window.scrollTo(0,0); }
function back(){ if (stack.length){ $("#q").value=""; view = stack.pop(); render(); updateBack(); window.scrollTo(0, view.scroll||0); } }
function sheetOpen(){ return $("#sheetbg").style.display==="flex"; }
function backAction(){ haptic(); if (sheetOpen()) closeSheet(); else back(); }
function updateBack(){
  const show = stack.length > 0 || sheetOpen();
  $("#backfab").classList.toggle("on", show);
  if (tg){ if (show) tg.BackButton.show(); else tg.BackButton.hide(); }
}
$("#backfab").onclick = backAction;
if (tg) tg.BackButton.onClick(backAction);

function badges(o){
  let l="", r="";
  if (o.is_new) l = `<span class="bdg l new">NEW</span>`;
  if (!o.in_stock) r = `<span class="bdg r out">QOLMADI</span>`;

}

function nrm(t){ return String(t||"").toLowerCase().replace(/[‘’`ʻʼ]/g,"'").replace(/,/g,"."); }
// "za 5" -> Zaftrik 5, "ta to 9" -> Tar tosh 9: har bir so'z mahsulot nomidagi so'z boshiga mos kelishi kerak
function matchQ(q, name, code){
  const c = nrm(code), flat = nrm(q).replace(/\s+/g,"");
  if (c && flat.length >= 3 && c.includes(flat)) return 6;
  const toks = nrm(q).replace(/([a-z'])(\d)/g,"$1 $2").split(/\s+/).filter(Boolean);
  if (!toks.length) return 0;
  const nm = nrm(name), words = nm.split(/[\s\-\/+]+/).filter(Boolean);
  let score = 0;
  for (const t of toks){
    if (c && t.length >= 3 && c.includes(t)){ score += 3; continue; }
    let hit = 0;
    for (const w of words){ if (w === t){ hit = 3; break; } if (w.startsWith(t)) hit = Math.max(hit, 2); }
    if (!hit && t.length >= 3 && nm.includes(t)) hit = 1;
    if (!hit) return 0;
    score += hit;
  }
  return score;
}

function loadImg(file){
  return new Promise((ok, bad) => { const u = URL.createObjectURL(file); const im = new Image();
    im.onload = () => { ok(im); setTimeout(()=>URL.revokeObjectURL(u), 1000); }; im.onerror = bad; im.src = u; });
}
async function shrink(file){
  try{
    let bmp;
    try { bmp = await createImageBitmap(file); } catch(e) { bmp = await loadImg(file); }
    const k = Math.min(1, 1600 / Math.max(bmp.width, bmp.height));
    const c = document.createElement("canvas"); c.width = Math.round(bmp.width*k); c.height = Math.round(bmp.height*k);
    c.getContext("2d").drawImage(bmp, 0, 0, c.width, c.height);
    const b = await new Promise(r => c.toBlob(r, "image/jpeg", 0.9));
    return b && b.size > 1000 ? b : file;
  }catch(e){ return file; }
}

  const move = (i, j) => { if (j < 0 || j >= L.length) return; const [x] = L.splice(i,1); L.splice(j,0,x); const y = window.scrollY; renderReorder(); window.scrollTo(0,y); haptic(); };
  m.querySelectorAll("[data-up]").forEach(b => b.onclick = () => move(+b.dataset.up, +b.dataset.up - 1));
  m.querySelectorAll("[data-dn]").forEach(b => b.onclick = () => move(+b.dataset.dn, +b.dataset.dn + 1));
  m.querySelectorAll("[data-ren]").forEach(b => b.onclick = async () => { const i = +b.dataset.ren; const v = await askText("Guruh nomi", L[i].cat); if (v){ L[i].cat = v; renderReorder(); } });
  $("#ro_cat").onclick = async () => { const v = await askText("Yangi guruh nomi", "", "masalan: Tarelka bort"); if (v){ L.unshift({cat:v}); renderReorder(); window.scrollTo(0,0); } };
  $("#ro_cancel").onclick = () => back();
  $("#ro_save").onclick = async () => {
    const layout = L.map(x => x.cat !== undefined ? {cat:x.cat} : {item:x.item});
    if (await act({action:"reorder", design:d.id, layout}, "Tartib saqlandi")) back();
  };
  loadSortable().then(ok => {
    const el = $("#rolist"); if (!ok || !el || !window.Sortable) return;
    Sortable.create(el, {handle:".hd", animation:150, delay:0, ghostClass:"ro-ghost",
      onEnd: () => { const order = [...el.children].map(r => L[+r.dataset.i]); L.length = 0; L.push(...order); const y = window.scrollY; renderReorder(); window.scrollTo(0,y); }});
  });
}
function askText(title, val, ph){
  return new Promise(res => {
    openSheet(`<h3>${esc(title)}</h3><input id="ask_v" value="${esc(val||"")}" placeholder="${esc(ph||"")}">
      <div class="acts"><button class="btn ghost" id="ask_c">Bekor</button><button class="btn" id="ask_ok">OK</button></div>`);
    $("#ask_c").onclick = () => { closeSheet(); res(null); };
    $("#ask_ok").onclick = () => { const v = $("#ask_v").value.trim(); closeSheet(); res(v || null); };
    setTimeout(() => $("#ask_v").focus(), 50);
  });
}
async function adminInfo(q){
  const r = await fetch("/api/admin/info?"+q, {headers:{"X-Init-Data":initData}}); return r.json();
}
function adminPanel(){
  openSheet(`<h3>⚙️ Boshqaruv</h3>
    <button class="choice" id="ap_rep"><span>📊</span><div><b>Hisobot</b><small>Qo'shilgan, qolmadi/keldi bo'lgan, tahrirlangan mahsulotlar va hozir qolmaganlar</small></div></button>
    <button class="choice" id="ap_chk"><span>🛠</span><div><b>Tekshirish (nazoratchi)</b><small>Bot holati va jadvallardagi xatolar: narx, kod, takrorlar</small></div></button>
    <div class="pinfo2">Adminlar va agentlar sozlamalari — botdagi ⚙️ Sozlamalar menyusida (faqat egasi uchun).</div>`);
  $("#ap_rep").onclick = () => reportSheet(24);
  $("#ap_chk").onclick = async () => {
    openSheet(`<h3>🛠 Tekshiruv</h3><div class="loading">Tekshirilmoqda…</div>`);
    try{
      const j = await adminInfo("t=check");
      const bot = j.bot.length ? j.bot.map(x=>`<li>${esc(x)}</li>`).join("") : "<li>Hammasi joyida ✅</li>";
      const pr = j.problems.length ? j.problems.slice(0,80).map(x=>`<li>${esc(x)}</li>`).join("") : "<li>Xato topilmadi ✅</li>";
      openSheet(`<h3>🛠 Tekshiruv</h3><div class="rep"><b>Bot holati</b><ul>${bot}</ul><b>Jadvallar (${j.problems.length})</b><ul>${pr}</ul></div>`);
    }catch(e){ toast("⚠️ Internet bilan muammo", true); }
  };
}
async function reportSheet(h){
  openSheet(`<h3>📊 Hisobot</h3><div class="loading">Tayyorlanmoqda…</div>`);
  try{
    const j = await adminInfo("t=report&h="+h);
    openSheet(`<h3>📊 Hisobot</h3><div class="seg">${[[24,"Bugun"],[168,"7 kun"],[720,"30 kun"]].map(([v,t])=>`<button data-h="${v}" class="${v===h?"on":""}">${t}</button>`).join("")}</div>
      <div class="rep">${j.html.replace(/\n/g,"<br>")}</div>`);
    document.querySelectorAll(".seg button").forEach(b => b.onclick = () => reportSheet(+b.dataset.h));
  }catch(e){ toast("⚠️ Internet bilan muammo", true); }
}
function findItem(d, id){ for (const c of d.categories) for (const i of c.items) if (i.id===id) return Object.assign({cat:c.name}, i); return null; }
function openTg(url){ if (tg && url.startsWith("https://t.me/")) tg.openTelegramLink(url); else window.open(url, "_blank"); }

async function act(body, okMsg){
  try{
    const r = await fetch("/api/admin", {method:"POST", headers:{"Content-Type":"application/json","X-Init-Data":initData}, body:JSON.stringify(body)});
    const j = await r.json();
    if (!j.ok){ toast("⚠️ "+(j.error||"Xato"), true); return false; }
    Object.assign(CAT, j.catalog);
    render();
    if (j.warnings && j.warnings.length) toast("⚠️ Nazoratchi: "+j.warnings.join("; "), true);
    else if (okMsg) toast("✅ "+okMsg+". Guruhdagi jadval yangilanadi.");
    return true;
  }catch(e){ toast("⚠️ Internet bilan muammo", true); return false; }
}

function openSheet(html){ $("#sheet").innerHTML = html; $("#sheetbg").style.display="flex"; updateBack(); }
function closeSheet(){ $("#sheetbg").style.display="none"; updateBack(); }
$("#sheetbg").onclick = e => { if (e.target.id==="sheetbg") closeSheet(); };

function editSheet(d, it){
  const cats = d.categories.map(c=>c.name);
  const isNew = !it;
  openSheet(`<h3>${isNew?"➕ Yangi mahsulot":"✏️ "+esc(it.name)}</h3>
    <label>Nomi</label><input id="f_name" value="${esc(it?it.name:"")}" placeholder="masalan: Aval kv 15">
    <label>Kodi</label><input id="f_code" value="${esc(it?it.code:"")}" placeholder="masalan: YA5999" style="text-transform:uppercase">
    <label>Narxi</label><input id="f_price" value="${esc(it?it.price:"")}" placeholder="masalan: 17$" inputmode="decimal">
    <label>O'lchami <small style="font-weight:400;color:#999">(rasm tagiga yoziladi, ixtiyoriy)</small></label><input id="f_size" value="${esc(it&&it.size?it.size:"")}" placeholder="masalan: 23sm">
    <label>Guruhi</label><input id="f_cat" list="cats" value="${esc(it?it.cat:(cats[cats.length-1]||""))}"><datalist id="cats">${cats.map(c=>`<option value="${esc(c)}">`).join("")}</datalist>
    <div class="acts"><button class="btn ghost" id="f_cancel">Bekor</button><button class="btn" id="f_save">Saqlash</button></div>
    ${isNew?"":`<button class="btn ghost addbtn" id="f_del" style="color:var(--red)">🗑 Jadvaldan o'chirish</button>`}`);
  $("#f_cancel").onclick = closeSheet;
  $("#f_save").onclick = async () => {
    const body = {design:d.id, name:$("#f_name").value, code:$("#f_code").value, price:$("#f_price").value, category:$("#f_cat").value, size:$("#f_size").value};
    if (!body.name.trim() || !body.price.trim()){ toast("Nomi va narxini yozing", true); return; }
    if (isNew) body.action="add_item"; else { body.action="edit_item"; body.item=it.id; }
    if (await act(body, isNew?"Qo'shildi (NEW belgisi bilan)":"Saqlandi")) closeSheet();
  };
  const del = $("#f_del");
  if (del) del.onclick = () => confirmDo(`«${it.name}» jadvaldan o'chirilsinmi?`, async () => { if (await act({action:"delete_item", design:d.id, item:it.id}, "O'chirildi")) closeSheet(); });
}
function addChooser(d){
  openSheet(`<h3>➕ Mahsulot qo'shish</h3><div class="pinfo2" style="margin:-6px 0 14px">${esc(d.title)}</div>
    <button class="choice" id="ch_old"><span>📚</span><div><b>Mavjud mahsulotlardan</b><small>Boshqa dizaynlardagi mahsulotlar — nomi, kodi, narxi tayyor. Bir nechtasini belgilab, birdan qo'shasiz.</small></div></button>
    <button class="choice" id="ch_new"><span>🆕</span><div><b>Yangi mahsulot</b><small>Hech qaysi dizaynda yo'q mahsulot — nomi, kodi, narxini o'zingiz yozasiz.</small></div></button>`);
  $("#ch_new").onclick = () => editSheet(d, null);
  $("#ch_old").onclick = () => pickSheet(d);
}
function pickSheet(d){
  const f = findDesign(d.id); const sec = f.sec;
  const keyOf = (n,c,g) => [String(n||"").trim().toLowerCase().replace(/\s+/g," "), String(c||"").trim().toUpperCase(), String(g||"").trim().toLowerCase()].join("|");
  const have = new Set(d.categories.flatMap(c=>c.items.map(i=>keyOf(i.name, i.code, ""))));
  const reg = (CAT.registry && CAT.registry[sec.key]) || [];
  const list = reg.map(e => Object.assign({}, e, {have: have.has(keyOf(e.name, e.code, ""))}));
  const sel = new Set();
  openSheet(`<h3>📚 Mavjud mahsulotlar</h3><div class="pinfo2" style="margin:-6px 0 10px">${esc(sec.title)} ro'yxatida ${list.length} ta mahsulot · ${list.filter(x=>x.have).length} tasi ${esc(d.title)} da bor</div>
    <div class="search pk"><span>🔍</span><input id="pk_q" type="search" placeholder="Qidirish: masalan «ta to 9»"></div>
    <div id="pk_list" class="pk-list"></div>
    <div class="pk-bar"><button class="btn ghost" id="pk_all">Hammasini belgilash</button><button class="btn" id="pk_go" disabled>Qo'shish (0)</button></div>`);
  const draw = () => {
    const q = $("#pk_q").value.trim();
    const rows = (q ? list.map((x,i)=>({x,i,sc:matchQ(q,x.name,x.code)})).filter(r=>r.sc).sort((a,b)=>b.sc-a.sc) : list.map((x,i)=>({x,i})));
    let last = null, h = "";
    for (const {x,i} of rows){
      if (!q && x.category !== last){ h += `<div class="pk-cat">${esc(x.category)}</div>`; last = x.category; }
      h += `<label class="pk-row ${sel.has(i)?"on":""} ${x.have?"have":""}" data-i="${i}"><input type="checkbox" ${sel.has(i)||x.have?"checked":""} ${x.have?"disabled":""}>
        <span class="rt"><b>${esc(x.name)}</b><small>${x.have?"✓ bu dizaynda bor · ":""}${esc(x.code||"—")} · ${esc(x.category)}${x.prices&&x.prices.length>1?` · narxlar: ${esc(x.prices.join(" / "))}`:""}</small></span><b class="rp">${esc(x.price)}</b>${thumbHtml(x.photo)}</label>`;
    }
    $("#pk_list").innerHTML = h || `<div class="empty-msg">${list.length ? "Topilmadi" : "Ro'yxat hali bo'sh"}</div>`;
    $("#pk_list").querySelectorAll(".pk-row").forEach(r => r.querySelector("input").onchange = e => {
      const i = +r.dataset.i; if (e.target.checked) sel.add(i); else sel.delete(i); r.classList.toggle("on", e.target.checked); upd(); });
  };
  const upd = () => { const b = $("#pk_go"); b.textContent = `Qo'shish (${sel.size})`; b.disabled = !sel.size; };
  $("#pk_q").oninput = draw;
  $("#pk_all").onclick = () => { const q = $("#pk_q").value.trim(); list.forEach((x,i)=>{ if (!x.have && (!q || matchQ(q,x.name,x.code))) sel.add(i); }); draw(); upd(); };
  $("#pk_go").onclick = async () => {
    const items = [...sel].map(i=>({name:list[i].name, code:list[i].code, price:list[i].price, category:list[i].category}));
    if (await act({action:"add_items", design:d.id, items}, `${items.length} ta mahsulot qo'shildi (NEW belgisi bilan)`)) closeSheet();
  };
  draw();
}
function newDesignSheet(secKey){
  const sec = CAT.sections.find(x=>x.key===secKey);
  openSheet(`<h3>➕ Yangi dizayn</h3><div class="pinfo2" style="margin:-6px 0 6px">${esc(sec.title)} bo'limiga</div>
    <label>Dizayn nomi</label><input id="nd_t" placeholder="${secKey==="boden"?"masalan: 008":"masalan: 15-OL"}">
    <div class="pinfo2" style="margin-top:8px">Keyin mahsulotlarni «📚 Mavjud mahsulotlardan» tez qo'shasiz. Dizayn rasmini botga yuborasiz.</div>
    <div class="acts"><button class="btn ghost" id="nd_c">Bekor</button><button class="btn" id="nd_s">Yaratish</button></div>`);
  $("#nd_c").onclick = closeSheet;
  $("#nd_s").onclick = async () => {
    const title = $("#nd_t").value.trim(); if (!title){ toast("Nomini yozing", true); return; }
    try{
      const r = await fetch("/api/admin", {method:"POST", headers:{"Content-Type":"application/json","X-Init-Data":initData}, body:JSON.stringify({action:"add_design", section:secKey, title})});
      const j = await r.json();
      if (!j.ok){ toast("⚠️ "+(j.error||"Xato"), true); return; }
      Object.assign(CAT, j.catalog); closeSheet(); toast("✅ Dizayn yaratildi. Endi mahsulotlarni qo'shing");
      go({name:"design", id:j.design}); const nd = findDesign(j.design); if (nd) pickSheet(nd.d);
    }catch(e){ toast("⚠️ Internet bilan muammo", true); }
  };
}
function renameSheet(d){
  openSheet(`<h3>🔤 Nomini o'zgartirish</h3><input id="r_t" value="${esc(d.title)}">
    <div class="acts"><button class="btn ghost" id="r_c">Bekor</button><button class="btn" id="r_s">Saqlash</button></div>`);
  $("#r_c").onclick = closeSheet;
  $("#r_s").onclick = async () => { if (await act({action:"rename", design:d.id, title:$("#r_t").value}, "Saqlandi")) closeSheet(); };
}
function confirmDo(text, fn){
  if (tg && tg.showConfirm) tg.showConfirm(text, ok => ok && fn());
  else if (confirm(text)) fn();
}

function thumbHtml(fid){ return fid ? `<i class="th" style="background-image:url('${img(fid,160)}')"></i>` : `<i class="th empty">L</i>`; }
function searchView(q){
  const out = [];
  for (const sec of scopeSections()) for (const d of sec.designs){
    const ds = matchQ(q, d.title, "");
    if (ds) out.push({d, it:null, sc:ds+1});
    for (const c of d.categories) for (const it of c.items){
      const sc = matchQ(q, it.name, it.code);
      if (sc) out.push({d, it, sc});
    }
  }
  if (!out.length) return `<div class="empty-msg">«${esc(q)}» — hech narsa topilmadi</div>`;
  out.sort((a,b)=>b.sc-a.sc);
  const head = `<div class="res-h">${out.length} ta natija · ${esc(scopeTitle())}</div>`;
  return head + out.slice(0,200).map(({d,it}) => it
    ? `<button class="res" data-id="${d.id}" data-item="${it.id}"><span class="rt"><b>${esc(it.name)}</b>${chips(it)}<small>${esc(d.title)} · ${esc(it.code||"")}</small></span><b class="rp">${esc(it.price)}</b>${thumbHtml(it.photo || d.photos[0])}</button>`
    : `<button class="res" data-id="${d.id}"><span class="rt"><b>${esc(d.title)}</b>${chips(d)}<small>dizayn</small></span><span class="rp">›</span>${thumbHtml(d.photos[0])}</button>`).join("");
}
function bindSearch(){ document.querySelectorAll(".res").forEach(b => b.onclick = () => { $("#q").value=""; go({name:"design", id:b.dataset.id, openItem:b.dataset.item||null}); }); }
$("#q").oninput = () => render();

load().catch(() => { $("#main").innerHTML = '<div class="empty-msg">Katalogni yuklab bo\'lmadi. Internetni tekshiring.</div>'; });
setInterval(async () => { if (document.hidden || $("#sheetbg").style.display==="flex") return; try{ const r = await fetch("/api/catalog"); const j = await r.json(); if (j.updated !== CAT.updated){ CAT = j; render(); } }catch(e){} }, 30000);
</script>
